services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-core-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_core
    ports:
      - "5432:5432"
    volumes:
      - erp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_core"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  erp-data:
